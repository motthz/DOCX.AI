name: Segnalazione bug
description: Qualcosa non funziona come previsto
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Versione DOCX.AI
      placeholder: "es. 0.3.0 (menu Aiuto o 'DOCX.AI.exe --version')"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passi per riprodurre
      placeholder: "1. Apri ...\n2. Clicca su ...\n3. Compare l'errore ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Cosa ti aspettavi e cosa è successo
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: Diagnostica
      description: "Allega lo ZIP creato da Aiuto → Crea pacchetto diagnostico (non contiene i tuoi rapporti)."
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options: [Windows 11, Windows 10]
