name: Release

on:
  push:
    tags: ["v*"]
  # avvio manuale da Actions (o via API) su main: il tag vX.Y.Z viene creato dalla
  # release stessa a partire da __version__
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      SKIP_COVERAGE_GATE: "1"
      SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - name: Versione da rilasciare
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          else {
            $m = Select-String -Path src\docx_ai\__init__.py -Pattern '__version__ = "([^"]+)"'
            $tag = "v" + $m.Matches[0].Groups[1].Value
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release $tag"
      - name: Release gia' pubblicata con gli asset?
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $n = gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" --json assets -q ".assets | length" 2>$null
          if ($n -and [int]$n -gt 0) { "skip=true" >> $env:GITHUB_OUTPUT } else { "skip=false" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0  # release inesistente: gh esce con 1, non e' un errore
      - uses: actions/setup-python@v6
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Ambiente di build
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install --require-hashes -r requirements.txt
          .venv\Scripts\python.exe -m pip install --require-hashes -r requirements-dev.txt
          choco install innosetup -y --no-progress
      - name: Bootloader PyInstaller compilato da sorgente (meno falsi positivi antivirus)
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        # Il bootloader precompilato di PyInstaller e' identico in migliaia di programmi,
        # anche malware: molti antivirus lo segnalano per "firma". Compilato qui con MSVC
        # e' un eseguibile unico. Stessa versione e hash verificato del sorgente.
        run: |
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          $ver = (Select-String -Path requirements-dev.txt -Pattern '^pyinstaller==(\S+)').Matches[0].Groups[1].Value
          "pyinstaller==$ver --hash=sha256:89b65a3ad07d9dd5832253e37bc45f31872d10d7f9d5c9fd0fdd6088a83829dd" | Out-File -Encoding ascii build-pyinstaller.txt
          .venv\Scripts\python.exe -m pip install --force-reinstall --no-deps --no-binary pyinstaller --require-hashes -r build-pyinstaller.txt
          .venv\Scripts\python.exe -c "import PyInstaller, pathlib; b = pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe'; print(b, b.stat().st_size)"
      - name: Certificato di firma (facoltativo)
        if: steps.check.outputs.skip != 'true' && env.SIGN_PFX != ''
        shell: pwsh
        env:
          SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
        # Con un certificato di firma del codice (secret WINDOWS_SIGN_PFX_BASE64 = file .pfx in
        # base64, WINDOWS_SIGN_PFX_PASSWORD = password) exe e installer vengono firmati:
        # SmartScreen e antivirus si fidano dei programmi firmati.
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          "SIGN_PFX_PATH=$pfx" >> $env:GITHUB_ENV
      - name: Build, ZIP portable e installer
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File scripts\release.ps1
      - name: Note di rilascio dal CHANGELOG
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.tag }}".TrimStart("v")
          .venv\Scripts\python.exe scripts\changelog_section.py $ver > release_notes.md
      - name: Pubblica release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          files: |
            release/DOCX.AI-Setup-*.exe
            release/DOCX.AI-*-portable-win64.zip
