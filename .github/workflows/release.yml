name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      SKIP_COVERAGE_GATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Ambiente di build
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install --require-hashes -r requirements.txt
          .venv\Scripts\python.exe -m pip install --require-hashes -r requirements-dev.txt
          choco install innosetup -y --no-progress
      - name: Build, ZIP portable e installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\release.ps1
      - name: Note di rilascio dal CHANGELOG
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          .venv\Scripts\python.exe scripts\changelog_section.py $ver > release_notes.md
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            release/MaintenanceAI-Setup-*.exe
            release/MaintenanceAI-*-portable-win64.zip
