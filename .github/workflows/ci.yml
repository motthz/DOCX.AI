name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src;.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dipendenze (lock con hash)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check src tests scripts packaging
      - name: Type check (mypy)
        run: python -m mypy
      - name: Unit test + copertura
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage run -a -m docx_ai.main --self-test
          python -m coverage report --fail-under=45
      - name: Traduzioni complete
        run: python packaging/extract_strings.py --check
      - name: Smoke test GUI
        run: python scripts/smoke_gui.py
