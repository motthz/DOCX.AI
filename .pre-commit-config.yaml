# Installazione: .venv\Scripts\pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
        exclude: '\.(ico|png|bmp|docx|xlsx)$'
      - id: check-added-large-files
        args: [--maxkb=2048]
  - repo: local
    hooks:
      - id: conventional-commit
        name: messaggio commit convenzionale
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
